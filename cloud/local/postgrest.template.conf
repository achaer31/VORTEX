# Copy to private/postgrest.conf and replace the password privately.
# The REST port is NEVER published. Its privileged anonymous role is internal only.
db-uri = "postgres://vortex_rest:REPLACE_WITH_URL_ENCODED_PRIVATE_PASSWORD@db:5432/vortex"
db-schemas = "public"
db-anon-role = "service_role"
db-config = false
db-pool = 3
db-max-rows = 1
server-port = 3000
log-level = "crit"
