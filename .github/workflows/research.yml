name: Research checks
on:
  push:
    paths: ['research/**', '.github/workflows/research.yml']
  pull_request:
    paths: ['research/**', '.github/workflows/research.yml']
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements-repro.txt
      - run: python -m pip install -r research/requirements-repro.txt
      - run: python -m unittest discover -s tests -v
        working-directory: research
