name: Dashboard checks
on:
  push:
    paths: ['dashboard/**', 'scripts/verify_snapshot.py', 'reports/**', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['dashboard/**', 'scripts/verify_snapshot.py', 'reports/**', '.github/workflows/dashboard.yml']
permissions:
  contents: read
jobs:
  snapshot-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dashboard/app.js
      - run: python scripts/verify_snapshot.py
